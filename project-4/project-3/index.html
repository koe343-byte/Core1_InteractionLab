<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ellsworth Kelly Red Yellow Blue, 2000</title>
<style>
    body {
        margin: 0;
        background: white;
    }
    .artwork {
        width: 600px;
        height: 600px;
        position: relative;
        margin: 50px auto;
    }
    .blue {
        width: 600px;
        height: 600px;
        background: #2F5D9F;
        position: absolute;
        left: 0;
        top: 0;
    }
    .yellow {
        width: 400px;
        height: 400px;
        background: #F2C33D;
        position: absolute;
        left: 0;
        bottom: 0;
    }
    .red {
        width: 200px;
        height: 200px;
        background: #B7352B;
        position: absolute;
        left: 0;
        bottom: 0;
    }
</style>
</head>

<body>
    <div class="artwork">

    <div class="blue"></div>
    <div class="yellow"></div>
    <div class="red"></div>
    </div>
</body>
</html>
