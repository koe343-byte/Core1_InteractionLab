<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewpoint" content="width=device-width, initial-scale=1.0">
<title>Eden's Interaction Lab Website</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Commissioner:wght@100..900&display=swap" rel="stylesheet">

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: "Commissioner", sans-serif;
        color: black;
        background-color: aliceblue;
        min-height: 100vh;
        padding: 0 2vw;
        display: flex;
        flex-direction: column;
    }

    .header {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        padding: 30px 1vw 16px 1vw;
        border-bottom: 1px solid black;
    }

    .logo {
        width: 110px;
        height: 110px;
        border-radius: 50%;
        background-color: black;
        color: aliceblue;
        font-size: 34px;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .menu {
        display: flex;
        gap: 90px;
        padding-right: 1vw;
    }

    .menu-item {
        background-color: #efe3e8;
        padding: 8px 16px;
        font-size: 16px;
        cursor: help;
        transition: 300ms all ease;
    }

    .menu-item:hover {
        background-color: #d999b4;
        color: black
    }

    .hero {
        flex: 1;
        padding: 1vh 1vw 40px 1vw;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
    }

    .row {
        display: flex;
        justify-content: space-between;
        font-size: 10.5vw;
        line-height: 1;
    }

    .arrow {
        width: 58px;
        display: flex;
        flex-direction: column;
        align-items: center;
        animation: bounce 1.7s infinite;
    }

    .arrow-line {
        width: 4px;
        height: 95px;
        background-color: black;
    }

    .arrow-head {
        width: 0;
        height: 0;
        border-left: 29px solid transparent;
        border-right: 29px solid transparent;
        border-top: 55px solid black;
    }

    @keyframes bounce {
        0% { transform: translateY(0); }
        50% { transform: translateY(18px); }
        100% { transform: translateY(0); }
    }

    .dropdown {
        position: relative;
    }

    .dropdown-list {
        display: none;
        position: absolute;
        top: 100%;
        right: 0;
        width: 350px;
        padding: 20px 25px;
        background-color: #efe3e8;
        z-index: 10;
    }

    .dropdown:hover .dropdown-list {
        display: block;
    }

    .dropdown-list a {
        display: block;
        padding: 14px 0;
        font-size: 14px;
        color: black;
        text-decoration: none;
        border-bottom: 1px solid black;
        transition: 300ms all ease;
    }

    .dropdown-list a:last-child {
        border-bottom: none;
    }

    .dropdown-list a:hover {
        padding-left: 10px;
    }

    .about-list {
        width: 575px;
        height: 500px;
    }

    .about-text {
        padding: 14px 0;
        font-size: 14px;
        border-bottom: 1px solid black;
    }

</style>
</head>

<body>

    <div class="header">
        <div class="logo">LAB</div>

        <div class="menu">
            <div class="dropdown">
                <div class="menu-item">About</div>

                <div class="dropdown-list about-list">
                    <div class="about-text">2026 Parsons School of Design Junior</div>
                    <div class="about-text">koe343@newschool.edu</div>
                </div>
            </div>

            <div class="dropdown">
            <div class="menu-item">Work</div>

            <div class="dropdown-list">
                <a href="project-1/index.html">Project 1</a>
                <a href="project-2pt.2/index.html">Project 2</a>
                <a href="project-3/index.html">Project 3</a>
                <a href="project4.html">Project 4</a>
                <a href="project5.html">Project 5</a>
                <a href="project6.html">Project 6</a>
                <a href="project7.html">Project 7</a>
            </div>
            </div>
        </div>
    </div>

    <div class="hero">
        <div class="titles">
            <div class="row">
                <div>Eden</div>
                <div>Ko's</div>
            </div>
    
    <div class="row second">
        <div>Core 1</div>
        <div>Interaction</div>
    </div>

    <div class="row">
        <div>Lab</div>
        <div>Projects</div>
    </div>
    </div>

    <div class="arrow">
        <div class="arrow-line"></div>
        <div class="arrow-head"></div>
    </div>

        </div>

</body>
</html>
